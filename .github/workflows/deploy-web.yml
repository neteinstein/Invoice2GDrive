name: Deploy web

# Every push to main builds the Kotlin/Wasm site once and publishes it to both GitHub Pages and
# Cloudflare Pages while the site moves between hosts. The two deploy jobs are independent: one
# host failing doesn't hold back the other. See README.md → Web deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # v6 defaults to a proprietary caching service; keep the open-source GitHub Actions cache.
          cache-provider: basic

      - name: Build wasmJs web distribution
        # The OAuth client ID isn't a secret (it ships in the page), so it lives in a repository
        # variable. Without it, users have to paste their own client ID in the app.
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID isn't set, so the site has no built-in Google sign-in. Visitors can still paste their own OAuth client ID on the Connect Google screen."
          fi
          ./gradlew :composeApp:wasmJsBrowserDistribution

      - uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Skipped, not failed, until the Cloudflare credentials are set: GitHub Pages still deploys.
      - name: Check Cloudflare configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set - skipped the Cloudflare Pages deploy (see README.md → Web deployment)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Reuse the exact build GitHub Pages gets: the Pages artifact is a tarball of the site.
      - uses: actions/download-artifact@v8
        if: steps.config.outputs.enabled == 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact

      - name: Unpack site
        if: steps.config.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/site"

      - id: deploy
        if: steps.config.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'invoice2sheet' }} --branch=main --commit-hash=${{ github.sha }}
